version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      html:
        - zensical build
        - ./mill __.scalaDocGenerated
    post_build:
      # Copy the built site into the directory Read the Docs publishes.
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
      - mkdir -p $READTHEDOCS_OUTPUT/html/modules/javadoc
      - cp --recursive out/joiners4s/scalaDocGenerated.dest/javadoc $READTHEDOCS_OUTPUT/html/modules/javadoc/base

python:
  install:
    - method: uv
      command: sync
