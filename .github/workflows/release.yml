name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "full"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Replace version
        run: just update-version "${{ github.event.inputs.version }}"

      - name: Run tests
        run: just test

      - name: Setup git name and email
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git checkout -b temporary-release-branch/${{ github.event.inputs.version }}
          git push origin HEAD:temporary-release-branch/${{ github.event.inputs.version }}

      - name: Commit version change
        run: |
          git add -A
          git commit -m "Bump version to ${{ github.event.inputs.version }}"
          git push origin HEAD:temporary-release-branch/${{ github.event.inputs.version }}

      - name: Create tag
        run: |
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Remove release branch
        run: |
          git push origin --delete temporary-release-branch/${{ github.event.inputs.version }}

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.event.inputs.version }}
          tag_name: "v${{ github.event.inputs.version }}"