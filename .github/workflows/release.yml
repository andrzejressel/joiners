name: Release
on:
  push:
    branches:
      - preparation-for-deployment
  workflow_dispatch:
    inputs:
      version:
        description: 'New version'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "full"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Replace version
        run: just update-version "0.0.0.1"

      - name: Run tests
        run: just test

      - name: Setup git name and email
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git checkout -b temporary-release-branch/0.0.0.1
          git push origin HEAD:temporary-release-branch/0.0.0.1

      - name: Commit version change
        run: |
          git add -A
          git commit -m "Bump version to 0.0.0.1"
          git push origin HEAD:temporary-release-branch/0.0.0.1

      - name: Create tag
        run: |
          git tag -a "v0.0.0.1" -m "Release v0.0.0.1"
          git push origin "v0.0.0.1"

      - name: Remove release branch
        run: |
          git push origin --delete temporary-release-branch/0.0.0.1

      - name: Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: 0.0.0.1
          tag_name: "v0.0.0.1"